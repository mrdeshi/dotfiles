# See https://wiki.hyprland.org/Configuring/Variables/ for more
decoration {
    rounding = 0#20
    blur {
        enabled = true
        size = 3
        passes = 0
    }
    shadow {
        enabled = true
        range = 4
        render_power = 2
        color = rgba(00000000)
    }
}
plugin:hyprglass {
    tint_color = rgb(000000)
    brightness = 1
    contrast = 1.0
    saturation = 1.0
    vibrancy = 1.0
    chromatic_aberration = 2
    fresnel_strength = 0.0
    blur_strength = 0.0
    blur_iterations =0
    layers {
        enabled = 1
        namespaces = bar, dock, bezel, notifications
        exclude_namespaces = some-debug-panel

        # Bezel: glass only on solid content (alpha >= 0.3), shadows pass through
        # Background overlay: full-area glass regardless of content
        namespace_mask_thresholds = quickshell:bezel=0.3, background=0.0
    }
}